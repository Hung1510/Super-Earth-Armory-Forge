name: booster names tool

# Builds FileDiver's booster-dumper for Windows with a double-click runner
# (tools/booster-names/build.sh) and attaches it to the run as booster-names-tool.zip.
# Run it from the Actions tab (boosters research).
on:
  workflow_dispatch:
    inputs:
      filediver_ref:
        description: FileDiver commit or branch
        default: 6d66a9c
  push:
    paths:
      - tools/booster-names/**
      - .github/workflows/booster-names-tool.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build booster-names-tool.zip
        env:
          FILEDIVER_REF: ${{ inputs.filediver_ref || '6d66a9c' }}
        run: tools/booster-names/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: booster-names-tool
          path: |
            tools/booster-names/dist/booster-names-tool.zip
            tools/booster-names/dist/booster-dumper.exe.sha256
